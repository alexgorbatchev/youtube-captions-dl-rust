[package]
name = "youtube-captions-dl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Download and format YouTube captions with an atomic local cache"

[dependencies]
anyhow = "1.0.104"
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "40210e689762f6606776764bb3696e2685198c2e" }
cli-deps = { git = "https://github.com/alexgorbatchev/deps-rust.git", rev = "6aef62e44a87f65d31283a77b93925f456362069" }
dirs = "6"
html-escape = "0.2.13"
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.27.0"
textwrap = "0.16.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
url = "2.5"

[dev-dependencies]
tiny_http = "0.12"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
