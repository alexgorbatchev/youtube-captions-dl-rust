[package]
name = "youtube-captions-dl"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Download and format YouTube captions with an atomic local cache"

[dependencies]
anyhow = "1.0.104"
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "dead4a60e08c7a84bc77ef329b220bfecd57627b" }
cli-deps = { git = "https://github.com/alexgorbatchev/deps-rust.git", rev = "b814d706b03944b98189280fd8c306daf219a382" }
dirs = "6"
html-escape = "0.2.13"
quick-xml = { version = "0.42.0", features = ["serialize"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.27.0"
textwrap = "0.16.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
url = "2.5"

[dev-dependencies]
tiny_http = "0.12"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
